name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai_mlc/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r ai_mlc/requirements-dev.txt
      - name: Lint
        run: ruff check ai_mlc
      - name: Type-check
        run: pyright ai_mlc
      - name: Test
        run: python -m unittest discover -s ai_mlc/tests -v
